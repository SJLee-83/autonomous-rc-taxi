# 차량 제원 — 2026-07-23 실측 (명세서 §26.3)
#
# 🔴 2026-07-24 기어비 변경: 모터 54T→바퀴 30T (증속 1.8) ⇒ 모터 30T→바퀴 54T (감속 0.556)
#    토크 ×3.24 / 속도 ×~0.31. 속도 의존 값은 재실측 전까지 참고치다.
vehicle:
  width_m: 0.15
  length_m: 0.28
  wheelbase_m: 0.14            # 실측 (기어비 무관 — 유효)
  wheel_diameter_m: 0.06
  max_steering_deg: 30.0       # 바퀴 조향각 (기어비 무관 — 유효)
  max_speed_mps: 0.22          # ✅ 2026-07-30 실차 실측 (실측 3 = B3 최대 속도):
                               #    풀스로틀 정속 0.50m/2.23s = 0.224, 6초 총거리 1.54m 교차검증.
                               #    보수적으로 0.22 채택. 잠정값 0.25·구값 0.2076 대체.
                               #    스로틀-속도 곡선(중간 점)·정지 거리는 미측정 — tools/t5_speed_run.py 로 추가 가능
                               #    ⚠️ 동반 수정: 웹팀 application.yml eta.vehicle-speed-mps 0.2076 → 0.22
                               # 📌 직진 드리프트 실측 기록 (2026-07-30): 서보 108° 풀스로틀 1.54m 주행 시
                               #    변위 방위각 좌 24°(차체 방향 변화 ~48°, 회전반경 ~1.85m, 유효 바퀴각 ~4° 좌).
                               #    원인 미확정(편측 토우 가능) → 사용자 결정: 트림 없이 중앙 108 유지,
                               #    폐루프 조향(vision·waypoint P)이 보정하는 것으로 확정
  min_turn_radius_m: 0.243     # 기하값 (기어비 무관 — 유효)
  gear_motor_teeth: 30         # 2026-07-24 변경 (구: 54)
  gear_wheel_teeth: 54         # 2026-07-24 변경 (구: 30)

steering:
  # 서보 각도 실측. 변환은 하드웨어 드라이버 계층만 안다 (protocol_2 §4.4)
  center_deg: 108
  left_max_deg: 51
  right_max_deg: 165
  wheel_angle_ratio: 0.526     # 바퀴각 = (서보각 - 108) × 0.526
