# turn_table.yaml — 차선별 회전 트리거 표 (2026-08-06 신설, §0-45 재설계)
#
# 왜 표인가: 지금까지 모든 커넥터를 하나의 FF 공식으로 처리한 것이 반복 실패의 뿌리였다.
#   사용자 실차 관찰 — "11번 우회전은 횡단보도 진입할 때부터 꺾어야 하고,
#   14번은 회전 구간 들어가기 전 직선구간에서부터 틀어야 (노란선을 좀 밟더라도)
#   다음 차선에서 정면 정렬이 잘 된다" → **회전마다 트리거 시점이 다르다.**
#
# 2단 구조 (사용자 확정 역할 분담)
#   1차 = 차선·좌표 (GPS)  : "지금 11번, 다음은 24번으로 우회전" — 거친 게이트.
#                            차선 끝까지 arm_distance_m 안에 들면 회전 준비(ARMED).
#   2차 = 비전            : ARMED 상태에서 버드아이 하단에 지정 노면표시가 들어오면 개시.
#                            **실제 꺾는 시점은 여기서 결정된다.**
#
# 트리거 시점 조절 = near_row_frac 하나로 한다
#   버드아이는 954x241px, 지면 깊이 0.89m, 하단(근거리) 폭 0.46m / 상단 폭 3.74m.
#   검출 상자 하단 y가 (높이 x near_row_frac) 보다 아래 = 차에 그만큼 가까이 왔다는 뜻.
#     near_row_frac 낮음 → 표식이 아직 멀 때 발화 = **일찍 꺾는다**
#     near_row_frac 높음 → 표식이 차에 바짝 붙었을 때 발화 = **늦게 꺾는다**
#   하단은 폭이 좁아 자기 차선 표식만 자연히 남는다 (원거리에는 다른 교차로 표식이 섞인다 —
#   0805 트레이스에서 stop_line 검출 횡거리 최대 1.44m = 차선 5~6개 밖까지 잡혔다).
#
# 🔴 세로 캘리브레이션(픽셀행 → 전방거리 m)은 아직 미측정이라 **미터를 쓰지 않는다.**
#   트리거를 전부 픽셀 비율로 정의해 캘리브 없이도 동작하게 했다 (§0-45 ③ 결론).
#
# 값의 지위: defaults 는 기하·검출률 근거가 있는 값. turns 개별 항목은 **실차 튜닝 대상**.
#   비전이 안 잡히면 fallback_at_lane_end 로 차선 끝(=좌표 단독) 개시로 떨어진다 —
#   즉 비전이 0이어도 주행은 계속된다 (무중단 폴백).
#
# 🔴 2026-08-07 — 이 파일은 **8/6 9차 상태로 롤백된 것**이다 (커밋 5196ecf4 그대로).
#   사유: 8/7 오후 수동 주행 데이터로 역산한 값을 얹었더니 실주행이 나빠졌다.
#     7->22  crosswalk@0.87       → 차선 끝 0.58m 앞 조기 발화(사람은 0.08m 앞), 코너 가로지름
#     22->14 direction_arrow@0.72 → 길이 0.21m 차선에서 즉시 발화, 복구 구간 0
#     29->7  0.85 → 0.73 → 0.68   → 수동 역산분
#     defaults max_turn 1.20→1.80 / "4->29" 항목 신설 / arc_complete_m 신설
#   9·10차는 이 표로 **무개입 완주**했다 — 실차 검증이 있는 유일한 상태다.
#
#   ⚠️ 함께 얹었던 것 중 **롤백하지 않은 것**이 있다 (사용자 선택 B, 2026-08-07):
#     control.yaml turn_throttle 0.5 → 0.8 · lane_follower 코스각 종료 · 조향 레이트 리밋.
#   9차는 29->7 (23.7°) 와 7->22 (50.0°) 가 상한 절단이었는데 그걸 없앤 게 이쪽이기 때문이다.
#   즉 **지금 상태는 9차와 완전히 같지 않다.** 9차를 그대로 재현하려면 저 셋도 되돌려야 한다.
#
#   되살릴 근거가 생기면: 수동 역산이 실주행과 어긋나는 이유부터 규명할 것.
#   7번을 중심선에서 12~16cm 벗어난 채 달린 것(차폭 0.25m)이 유력한 후보다.

turn_table:
  defaults:
    arm_distance_m: 0.60          # 차선 끝까지 이 거리 안 = 회전 준비. 짧은 차선은 길이로 클램프
    start_offset_m: 0.0           # 트리거 발화 후 이만큼 더 가서 개시 (미세 지연용, 0 = 즉시)
    wheel_deg: null               # null = 커넥터 반경 기하로 자동: atan(축거/R)
                                  #   우회전 R0.26 -> 28.3° / 좌회전 R0.35 -> 21.8° (축거 0.14)
    exit_align_deg: 12.0          # 다음 차선 방위와 이 안으로 정렬되면 회전 종료
    min_turn_m: 0.10              # 이 거리 전에는 종료 판정 안 함 (개시 직후 오정렬 종료 방지)
    max_turn_m: 1.20              # 안전 상한 — 정렬 못 맞춰도 여기서 종료하고 직선 추종 복귀
    fallback_at_lane_end: true    # 비전 미발화 시 차선 끝에서 개시 (좌표 단독)
    trigger:
      class: null                 # null = 비전 트리거 없음 (좌표 폴백만)
      min_conf: 0.45              # 0805 실측 평균 conf: arrow 0.73 / stop_line 0.70 /
                                  #   crosswalk 0.62~0.71 — 0.45는 충분한 여유
      near_row_frac: 0.80
      max_lateral_m: 0.30         # 검출 중심이 차량 진행축에서 이보다 멀면 남의 차선 표식으로 보고 기각

  # ---- 개별 회전 (키 = "출발차선번호->도착차선번호") ----
  # 비전 트레이스 보유: 0805 drive3/4 = {11->22, 22->14, 7->22} + 0806 run1 = 시나리오 2 전 6회전.
  # 값의 근거는 0806_run1 역산 (자료/주행데이터/0806/0806_시연주행_관찰기록.md + trace.jsonl).
  # 14->19, 20->3 은 0806 녹화에서 근접 게이트 안 검출이 0건이라 항목을 만들지 않는다
  # (14->19 는 4->29 대칭 상속이 적용되고, 트리거 미발화 시 좌표 폴백이 어차피 받친다).
  turns:
    "11->22":
      # 사용자 실차 관찰: "11번에서 우회전하려면 **횡단보도 진입할 때부터** 꺾어야 한다"
      # 11번 노면표시 순서 = 방향표시 → 정지선 → 횡단보도. 마지막 표식인 횡단보도가
      # 시야에 들어오는 시점 = 교차로 진입 시점이라 트리거로 적합하다.
      trigger:
        class: crosswalk
        near_row_frac: 0.70       # 다소 이르게 — "진입할 때부터"
      exit_align_deg: 12.0

    "4->29":
      # 이 항목은 **값을 주기 위한 게 아니라 대칭 상속을 끊기 위해 존재한다.**
      #   2026-08-06 저녁 6차 후 사용자 판정: 이 회전은 좌표 폴백이 물리적 최적이다
      #   (비전 발화 주행 4·5차 = 인도 침범 / 폴백 주행 6차 = 정렬 4.8° 최상).
      #   비전 트리거도, 개시 앞당김도 넣지 않는다 — 8/6·8/7 통틀어 문제 신고가 없었다.
      #
      # 🔴 2026-08-07 저녁: 아래 "14->19" 를 신설하자 이 회전이 **점대칭 상속으로 그 값을
      #   그대로 받아버렸다** (lead 0.21 · max_turn 0.85). 신고된 곳만 고치기로 했으므로
      #   여기서 명시적으로 막는다. 이 항목을 지우면 14->19 값이 다시 흘러 들어온다.
      #
      # 🔴 2026-08-07 저녁 **개시 0.21m 앞당김** (사용자 지시 — "4번 도로 끝지점 조금 앞에서
      #   우회전하게 해달라". 14->19 와 같은 처방이고, 두 회전이 점대칭 짝이라 값도 같다).
      #
      #   기하: 동향(0°)에서 우회전해 29번(x=4.61)에 안착하려면 반경 R 앞에서 호를 시작해야
      #     한다. 맵은 설계 R=0.26 기준이라 시작점이 x=4.35(=4번 차선 끝)로 그려져 있다.
      #     실측 실효 반경은 0.47m 이므로  필요한 시작점 x = 4.61 - 0.47 = 4.14
      #     → 차선 끝보다 **0.21m 앞**.
      #
      #   19:37 주행 실측 (앞당기기 전):
      #     개시 (4.333, 2.545) = 차선 끝    → 궤적 최동단 x=4.808 (코너 한계 4.61 대비 +0.20)
      #     개시 후 5초간 x 4.37→4.60 을 y 2.54 로 거의 직진 — 그 구간이 인도다.
      #   ⚠️ 반경이 커진 탓에 호를 다 그리면 y 는 2.61-0.47 = 2.14 로 내려온다. 29번이
      #      (4.61,2.35)~(4.61,2.14) 이니 **29번 끝자락에 진입**하게 된다. x 는 맞고 y 만
      #      늦는 셈이라, 인도를 밟는 지금보다는 낫지만 완전한 해결은 아니다.
      #      근본 해결은 실효 반경(설계 0.26 vs 실측 0.47)이다 — 정적 조향각 측정 대기.
      # 🔴 0.21 → 0.11 (2026-08-07 저녁, 사용자 지시 "10cm 만 더 앞에 가서 꺾자").
      #   20:20 실측: 개시 (4.094, 2.654) — 4번 끝(4.35)보다 0.21m 앞.
      #   ⚠️ 대가: 호 최동단이 개시x + 전반반경(실측 0.54) 이라 4.63 → **4.73** 이 된다.
      #      안쪽 차선 동쪽 경계가 4.735 라 차체 반폭(0.075)까지 더하면 넘어간다.
      #      바깥 북행 차선(4.735~4.985)을 스치는지 다음 주행에서 반드시 확인할 것.
      # 🔴 0.11 → 0.05 (2026-08-07 밤, 사용자 지시 "끝점 5cm 앞에서 풀로 우회전").
      #   ⚠️ 호 최동단 = 개시x + 전반반경(실측 0.54) = 4.30 + 0.54 = **4.84**.
      #      바깥 북행 차선이 4.735~4.985 라 **그 안으로 들어간다** (차체 포함 4.92).
      #      대향 차선을 무는지 이번 주행에서 반드시 확인할 것. 물면 0.11 로 되돌린다.
      fallback_lead_m: 0.05
      #
      # 🔴 2026-08-07 저녁 **29번을 건너뛰고 7번까지 한 번에 돈다** (사용자 제안).
      #   왜: 90° 코너 두 개로 쪼개면 각 설계 반경이 0.26m 인데 이 차는 못 낸다(실측 0.47m).
      #     게다가 중간 29번(길이 0.21m)에서 종료 판정이 한 번 더 끼어들어 조향을 놓는다 —
      #     19:43 실측에서 4->29 가 **0.30m 만에** 끝났다 (heading 8.8° 정렬 판정,
      #     실제 진행 방향은 63.5° 어긋나 있었다). 그래서 개시를 앞당겨도 효과가 없었다
      #     (코너 초과 lead 0.00 +0.222m → lead 0.21 +0.280m, 오히려 늘었다).
      #   180° 한 번으로 보면 기하가 정반대로 맞는다:
      #     4번(y=2.61) → 7번(y=1.63) 횡간격 0.98m = 180° 회전의 지름
      #     필요 반경 0.49m  vs  실측 실효 반경 0.47m   ← 2cm 차이
      #   즉 "못 내는 반경"이 이 묶음에서는 정답이 된다.
      #   ⚠️ 29번은 통과 지점이 될 뿐 다리로 밟지 않는다. 29->7 항목의 stop_line 트리거는
      #      이 묶음이 켜져 있는 동안 **평가되지 않는다** (묶음 종료 판정은 7번 방위로 한다).
      fuse_next: true
      min_turn_m: 0.90            # 90° 지점(호 0.77m) 전에는 종료 판정 자체를 막는다
      max_turn_m: 2.20            # 🔴 1.80 → 2.20 (2026-08-07 밤, 사용자 "조금만 더 꺾자").
                                  #   21:09 실측: 이번 실효 반경이 **0.678m** 로 나왔다
                                  #   (직전 0.54 / 그 전 0.497 — 주행마다 흔들린다).
                                  #   180° 호장이 π×0.678 = 2.13m 라 상한 1.80 에서 잘려
                                  #   **정렬 71.9° 로 덜 돈 채** 끝났다 (종료 x=4.586).
                                  #   조향은 이미 서보 클램프라 더 못 준다 — 대신 **더 오래**
                                  #   돌게 열어 준다. 반경 0.678 기준 180° + 3% 여유.
                                  # ⚠️ 반경이 작은 날(0.49)에는 정렬 판정이 먼저 걸려 1.6m 쯤에
                                  #   끝난다. 이 값은 상한이지 목표가 아니다.
                                  # ⚠️ 14->19 의 0.85 를 따라가면 안 된다 — 반 바퀴도 못 돈다.
      exit_align_deg: 12.0

    "29->7":
      # 0806 실측: 29번 정지선이 row 0.85 도달 = 14:54:16.9 ≈ 티 진입인데, 실제 개시는
      # 14:54:11.0 (4->29 종료 즉시 — 29번이 0.21m 라 arm 즉발) -> 6초 조기 = 1.11m 광폭
      # 회전, 대향 차선 진입. 같은 시각 GPS 순단 2회(터널 이음) — 비전 앵커는 무관.
      trigger:
        class: stop_line
        near_row_frac: 0.85
      exit_align_deg: 12.0

    "7->22":
      # 좌표 폴백을 유지하되 개시만 앞당긴다 (2026-08-06 9차).
      #   사용자 판정: 이 회전은 차선 끝 개시(폴백)가 최적 — 비전 트리거는 3~4초 일찍 꺾어 폐기했다.
      #   그런데 frame_transform 재적합(x 스케일 1.025→1.082)으로 같은 물리 지점에서 차량이
      #   자기를 더 동쪽으로 인식하게 됐고, 7번은 서향이라 "차선 끝까지 남은 거리"가 늘어
      #   개시가 약 12cm 늦어졌다 (9차 육안: "더 직진하고 좌회전 → 오른쪽 바퀴 보도블럭").
      #   → 늦어진 만큼만 되돌린다. 비전은 여전히 쓰지 않는다.
      fallback_lead_m: 0.12

    "20->3":
      # 2026-08-06 8차: 북서 코너 GPS heading 노이즈로 종료 판정(정렬 11°)이 안 걸리면
      # 상한 1.20m = 호 264° 까지 돌아 실물 과회전(잔차 149° 사건). 정상 종료 실측이
      # 0.74m/9.2°(6차)라 0.85로 조임 — 정상엔 여유, 판정 실패 시 187° 선에서 강제 종료.
      # 트리거는 없음(좌표 폴백 유지 — 이 코너 폴백이 사용자 판정 최적).
      # 🔴 2026-08-08 밤 — lead 0.285 + 개루프 호장 종료 (14->19 와 같은 처방).
      #   19:35/19:39 실측: lead 0 이라 차선 끝(y 2.35)에서 개시 → 착지 y = 2.35+0.545
      #   = 2.895 — 3번(2.61)보다 29cm 북쪽, 대향 차선(2번) 위로 떨어졌다.
      #   우리집 정차가 (1.13, 2.89) 북쪽 28cm 로 끝난 원인 (사용자 "도착 지점 못 들어감").
      #   lead = R실측 − R설계 = 0.545 − 0.26 = 0.285 → 개시 y 2.065, 착지 y 2.61 = 3번 중심선.
      #   ⚠️ 20번 유효 구간이 2.01~2.35 (0.34m) 라 여유 5.5cm — 빠듯하지만 들어간다.
      #   min=max = (π/2)×0.545 — GPS/추정 방위 판정 배제, 정확히 90° 만 돈다.
      #   (구 max 0.85 는 과회전 방지용이었다 — min=max 가 그 역할을 흡수한다)
      fallback_lead_m: 0.285
      min_turn_m: 0.856
      max_turn_m: 0.856

    "22->14":
