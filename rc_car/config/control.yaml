# 제어 설정 — 초안값. 주행 테스트 후 조정 (명세서 §18.2)
# 조향·감속 파라미터는 taxi/navigator.py 실증값을 바퀴각 기준으로 이식 (⑤ 폴백 조향)
control:
  loop_hz: 50
  lookahead_min_m: 0.25        # ⚠️ 최소 회전반경 0.243m 이상이어야 추종 가능
  lookahead_max_m: 0.40
  corner_lookahead_m: 0.12     # 코너 창 안 시선 단축 — 진입 전 조기 커팅 방지
                               # (2026-08-05 저녁 좌회전 S자: 사전 13cm 파고듦 → 출구 밀림)
  ff_entry_lead_m: 0.05        # FF 선행 개시 — 호 시작 전 이 거리부터 코너 조향을 건다 (시뮬 스윕 최적, 지연 0.15s 모델)
                               # (서보 스윙 ~0.2s + 관성으로 정시 개시는 진입점 지나침 — 실차 관찰)
  destination_slowdown_distance_m: 0.40
  arrival_radius_m: 0.40               # 🔴 0.15 → 0.40 (2026-08-08, 사용자 지시 "0.40으로 통일").
                                       #   관제서버 main_track.yaml 이 0.40 인데 차량이 0.15 라 어긋나 있었다.
                                       #   차량이 더 엄격해서 "관제는 완료, 차는 미도착" 이 날 수 있었다.
                                       #   ⚠️ map/places.yaml 의 같은 키도 함께 0.40 으로 맞춰야 한다
                                       #      (tests/unit/test_places.py::test_meta_radius_matches_control_config).
                                       #   ⚠️ 알려진 대가: test_arbitrary_destination 의 게이트 전수 검사가
                                       #      mid_wb1_w(6번)·mid_eb2_e(12번, 시장) **차선 끝 0~2cm** 에서 깨진다.
                                       #      반경 40cm 원이 이음매까지 덮어 차선 확정이 안 된다.
                                       #      시연 노선(면사무소·우리집)은 무해하지만 시장 정차엔 걸릴 수 있다.
                                       # (구) 2026-08-04 실차: 0.10에서 도착 미성립→재선회 빈발.
  stop_trigger_radius_m: 0.10          # 스로틀 컷 트리거 — 도착 게이트(arrival_radius_m)와 분리
                                       # 2026-08-06 7차: cruise 0.4 에서 최근접 0.076m 가 0.05 에
                                       # 못 미쳐 컷 미발화 → 감속 없이 통과 → 지나침 정차 (도착 실패).
                                       # 0.10 으로 원복 — 관측된 최근접(0.076) 위에서 컷이 걸린다
  # 🔴 평행 정차 창 (2026-08-07 저녁 신설 — lane_follower._parallel_stop_target).
  #   최종 목표까지 이 거리 안에 들면 목표를 **정차점 너머 차선 방향**으로 옮겨,
  #   점을 맞히는 대신 차선 위로 올라타 달리게 한다 → 도착 자세가 차선과 나란해진다.
  #   정지 판정도 유클리드가 아니라 **차선 방향 남은 거리**로 바뀐다.
  #   근거 (19:44 면사무소 실측): 정차 직전 방위 190~235° (14번 방위 180°) — 최대 55° 틀어짐.
  #   사용자 지적: "면사무소 좌표 들어갈 때 조향을 주고 정지한다."
  #   ⚠️ 22->14 회전 자체는 무관하다 — 회전이 끝난 뒤 14번 직선 최종 접근에서만 걸린다.
  #   0 이하 = 비활성(기존 동작).
  parallel_stop_distance_m: 0.40
  # 🔴 회전 직후 차선 복귀 (2026-08-07 저녁 신설 — lane_follower._recenter_target).
  #   회전이 끝난 뒤 이 거리 동안은 **차선 중심선 위 lookahead 앞** 을 겨눈다.
  #   근거 (20:20 융합 회전 실측): 회전은 7번 중심선 +3cm 로 정확히 끝났는데,
  #     그 뒤 7번 1.26m 를 달리며 y 1.660 -> 1.497 로 16cm 남하해 중앙선(1.505)을 물었다.
  #     직선 목표가 차선 끝점(1.26m 앞)이라 3cm 오차가 방위 오차 1.4° 밖에 안 만들고,
  #     그 사이 heading 노이즈(이 구간 튐 8회, ±25~30°)가 차를 끌고 간다.
  #   0.25m 앞 목표로 바꾸면 같은 3cm 가 7° 가 되어 즉시 복귀한다.
  #   ⚠️ 회전 직후에만 건다 — 직선 전체를 바꾸면 코너 진입 전 의도적 바깥쪽 물기가 죽는다.
  #   0 이하 = 비활성.
  lane_recenter_distance_m: 0.60
  # 🔴 직선 구간 차선 위 추종 (2026-08-07 밤 — lane_follower._recenter_target).
  #   true  = 목표를 **차선 중심선 투영 + lookahead** 로 잡는다 (순수 추종 정석, 점근 수렴)
  #   false = 구 동작(차선 끝점 겨냥) + 위 recenter 창만 사용
  #   사용자 신고 3건이 전부 끝점 겨냥의 대각선 돌진/넘어감이었다:
  #     14번 발차 시 중심선을 넘어 인도 2.3cm 앞까지 / 14->19 를 y 10cm 북쪽에서 개시해
  #     호가 인도 통과 / 19-20 에서 서쪽 0.23m → 동쪽 0.10m 로 31cm 넘어감.
  #   차선 위 추종이면 정렬 상태에서 목표가 정면이라 조향이 0 이 된다 ("정렬되면 그냥 간다").
  lane_line_following: true
  # 🔴 횡오차 불감대 (2026-08-07 밤, 사용자 지시 "정렬되면 그냥 가라").
  #   차선 중심선에서 이 안에 있으면 **중심선으로 당기지 않고** 진행 방향만 유지한다.
  #   왜 필요한가: 14번은 북쪽 가장자리(0.515) 바로 위가 인도(block_sw 0.52)라
  #     중심선 복귀가 곧 인도 방향이다. 20:35 실측에서 y −0.083 → +0.107 로 넘어가
  #     인도까지 2.3cm 남았고, 그 자세로 14->19 를 돌면 호가 (0.535,0.520)=인도를 지난다.
  #     남쪽에 붙어 있는 편이 이 코너에서는 더 안전하다.
  #   0.10 = 차선 반폭 0.125 의 80%. 차선 안이면 그냥 간다는 뜻이다.
  #   0 이하 = 불감대 없음(항상 중심선 복귀).
  lane_deadband_m: 0.10
  # 🔴 GPS 방위 전면 무시 차선 (2026-08-07 밤, 사용자 지시).
  #   "4번 도로에서는 좌표만 받고 heading 값 무시하고 가라."
  #   여기 적힌 차선에서는 임계 판정(heading_guard) 없이 **위치가 그린 진행 방향만** 쓴다.
  #   근거 (21:00 주행, 4번): 실제 진행 341~351°(남동) vs GPS 0~11°(동·약간 북).
  #     제어기가 GPS 를 믿고 우측 조향을 계속 내 y 가 0.54m 동안 12cm 떨어졌다.
  #     차이 19~21° 가 튐 방어 임계 25° 바로 아래라 안 걸렸다.
  #   ⚠️ 정지·저속에선 진행 방향을 못 구해 GPS 로 떨어진다 (그때는 조향이 무의미).
  # 🔴 [4, 19, 20] → [4] (2026-08-08, 사용자 지시 "19번 도로 진입하면 그때부터는
  #   GPS 에 맞춰서 20번 도로 끝까지 가게 해"). 19·20 을 목록에서 뺀다 =
  #   그 구간에서 **GPS 방위를 다시 쓴다**. heading_guard(25°) 판정은 그대로 받는다.
  #   되돌리려면 [4, 19, 20] (8/7 밤 마지막 값). 아래 8/7 주석은 그때 근거로 남겨 둔다.
  #   🔴 [4] → [4, 19, 20] **재복원** (2026-08-08 오후, 실주행으로 즉시 기각).
  #     오전에 19·20 을 뺐더니(GPS 방위 사용) 15:10 주행 19->20 구간에서
  #     **30초 동안 튐 방어가 19회 전환**했다. 추종 기준이 GPS 방위 ↔ 진행 방향을
  #     계속 갈아타면서 조향 목표가 뒤집혀, 차가 중심선(0.39) 좌우로 진폭 0.37m 로
  #     왕복했다 (최서단 x=0.016 = 맵 경계 1.6cm). heading 차이가 최대 169.5° 다.
  #     임계 25° 근처 값(-26.0/-29.1/+27.3/-27.8)이 히스테리시스 없이 토글된 것도 겹쳤다.
  #     → 8/7 밤 판단이 옳았다. 서편 GPS 방위는 쓰지 않는다.
  course_heading_lanes: [4, 19, 20]
  #   (8/7 밤 근거 — 2026-08-08 철회됨) 19·20 추가, 사용자 "19번 들어가자마자 20번 끝점까지 헤딩 무시하고 직진".
  #   서편은 GPS 방위가 가장 심하게 튀는 구역이다 — 20:38 실측 GPS 170~256° vs 실제 41~48°.
  #   19번은 길이 0.21m 이고 그 뒤 직진 커넥터 1.28m 는 어느 다리에도 안 속해 leg.lane_num
  #   이 20 으로 잡힌다. 두 번호를 다 넣어야 19번 진입 순간부터 20번 끝까지 덮인다.
  # 🔴 정지 중 조향 금지 (2026-08-07 밤, 사용자 지시).
  #   "4번 주행 시작 직전에 heading 받아서 정지 상태의 직진 정렬을 수정하는데 막아라."
  #   21:22 대기 중 실측: pose 붙박이인데 y 오차 +0.105 가 불감대(0.10)를 아슬하게 벗어나
  #   남쪽 조향이 계속 나갔다. 서 있을 때 바퀴를 트는 건 이득이 없고 출발 순간 해가 된다.
  #   판정은 course_heading_lanes 차선에서 진행 방향 베이스라인 미확보 = 실질 정지.
  #   ⚠️ 적용 차선을 course_heading_lanes 와 **분리**했다. 묶어 뒀더니 19·20 을 그 목록에
  #     넣는 순간 같이 걸려, 22:27 주행에서 차가 x=0.02(중심선 서쪽 0.37m)에 선 채
  #     **조향 0 으로 95초간 직진만** 했다. 서편은 원래 기어가는 구간이라 진행 방향
  #     베이스라인을 못 채우고, 그게 "정지"로 판정돼 복귀 조향이 영영 안 나갔다.
  #     정지 조향금지가 필요한 곳은 출발 지점(4번) 하나뿐이다.
  # 🔴 [4] → [3, 4, 14] (2026-08-08 저녁, 사용자 "정차할 때 조향각이 평행하지 않아
  #   다음 발차 때 문제"). 시나리오 2 의 정차 차선 = 14(면사무소)·3(우리집)인데 4에만
  #   걸려 있었다. 18:52 실측: 면사무소 정차 (1.24, 0.235) — 횡오차 0.155 가 불감대를
  #   넘어 **바퀴가 꺾인 채 6.5초 대기**, 그 각도로 발차했다.
  #   ⚠️ 19·20 을 넣으면 안 되는 이유(8/7 95초 직진 사고)는 그대로 유효하다 —
  #      여기는 정상 속도 차선이라 주행 중엔 베이스라인이 서고, 정지 때만 0 이 된다.
  #   부작용(알고 감수): 회전 직후 첫 0.15m(베이스라인 형성 전)는 조향이 0 이다.
  # 🔴 [3, 4, 14] → [4] **당일 롤백** (2026-08-08 밤, 19:32~19:42 실주행 3회로 즉시 기각).
  #   14를 넣자 도착 접근 저속 구간에서 베이스라인 미형성 = "정지" 판정 →
  #   조향 0 고정 → 횡오차 0.23m 을 안고 heading 180 에 얼어붙은 채 직진
  #   (19:34:56~19:35:04 실측, 사용자 "대각선 방향으로 직진"). 8/7 의 95초 직진과
  #   같은 기전이다 — hold 는 "정지 중"만이 아니라 **기어가는 내내** 걸린다.
  #   정차 바퀴 정렬 문제는 22->14 min=max·20->3 lead 로 접근 오차 자체를 줄여 대응한다.
  hold_steer_lanes: [4]
  # 🔴 직선 구간 조향 완전 금지 (2026-08-08, 사용자 지시 "4번에서는 조향하지 말고 직진만").
  #   위 hold_steer_lanes 는 **정지 중**에만 막는다 — 주행이 시작되면 횡오차 복귀 조향이
  #   그대로 나간다. 0807 22:32 과 0808 3회차가 둘 다 4번에서 우조향으로 중심선에 수렴했고,
  #   그게 이 설정이 없어서 생긴 정상 동작이었다.
  #   여기 적힌 차선은 주행 중에도 조향을 0 으로 고정한다. 회전에는 안 걸린다.
  #   ⚠️ 전제: 출발 배치가 정확해야 한다. 0808 3회차는 y=2.762(대향 차선)에서 출발했는데
  #      복귀 조향이 회전 개시까지 2.616 으로 되돌려 놨다. 이제 그 보정이 없다 —
  #      틀어진 채 출발하면 그 오차가 4->29 융합 회전 착지까지 그대로 간다.
  #   빈 목록 = 기능 꺼짐.
  straight_only_lanes: [4]
  # 🔴 회전 중 맵 이탈 방지 (2026-08-07 밤, 사용자 지시).
  #   회전은 개루프라 한 번 열리면 정렬까지 같은 각도로 돈다. 반경이 커진 날엔 그 호가
  #   맵 밖으로 나간다 — 21:24 실측 최서단 x = -0.034.
  #   경계에서 turn_margin_m 안으로 들어오면 정렬과 무관하게 회전을 끊고 직선 추종으로
  #   돌아간다. 개루프로 계속 도는 것보다 안전하다.
  #   ⚠️ 14->19 를 뒤로 미룰수록 종료가 서쪽이라 이 방어가 더 자주 걸린다 — 정상이다.
  map_bounds:
    x_max: 5.0
    y_max: 3.0
    turn_margin_m: 0.01     # 🔴 0.08 → 0.01 (2026-08-07 밤, 실주행으로 즉시 기각).
                            #   0.08 은 **융합 회전을 죽였다**:
                            #     22:12  회전 4->29 맵 경계 종료 (4.920, 2.313) 정렬 68.3°
                            #   임계가 5.0-0.08=4.92 인데 융합 180° 는 원래 x 4.84~4.98 까지
                            #   나가야 한다(호 최동단 = 개시x + 반경). 그 구간은 맵 밖이 아니라
                            #   **바깥 북행 차선(4.735~4.985)** 이다 — 실제 도로다.
                            #   서편(14->19 가 x=-0.034 로 진짜 이탈)만 보고 잡은 값이 동편을
                            #   막아 버렸다. 이제 **진짜 맵 이탈**만 잡는다:
                            #     서 x<0.01 / 동 x>4.99 / 남 y<0.01 / 북 y>2.99
                            #   0 = 방어 끔
  waypoint_spacing_m: 0.02             # §15 재샘플 간격
  steer_full_lock_error_deg: 30.0      # 이 heading 오차에서 최대 조향
                                       # 45(taxi 실증값) → 30: 2026-08-01 시뮬 검증 — 코너 이탈
                                       # 8.2→4.8cm, 직진 진동 없음 (tools/turn_param_sim.py, 실차 검증 대기)
  align_heading_error_deg: 10.0        # 이 이상 틀어지면 감속 (taxi ALIGN)
  align_throttle_ratio: 1.0            # 2026-08-03: 감속 배율 무력화 유지
  cruise_throttle: 0.4                 # 2026-08-07: 0.6 상향 검토했다가 **0.4 유지**(사용자 결정).
                                       # 근거: 비전 트리거 판정은 ARMED 에서만 일어나고, ARMED 는
                                       # 스로틀을 turn_throttle(0.8)로 바꾼다 — 즉 트리거 구간은
                                       # 전부 회전 속도라 cruise 와 무관하다. 도착 접근 속도만
                                       # 60% 빨라져(0.052→0.083) 8/6 7차 도착 실패 리스크를 되살린다.
                                       # ⚠️ 미해결로 남는 것: 데드존(0.24) 여유가 0.16 뿐이라
                                       #   0807 10번 차선 정지(throttle 0.40 인데 30초간 3cm)의
                                       #   후보 원인으로 남아 있다. 재발하면 여기부터 본다.
                                       # (구) 2026-08-06 3차 주행 후 상향 (0.3 -> 0.4, 사용자 결정):
                                       # 0.3 실측 0.052m/s 는 체감 과속 아님이 아니라 과저속 —
                                       # 19-20 직선 131초의 절반이 이 값 탓. 0.4 ≈ 0.073m/s (+40%),
                                       # 데드존(0.24) 여유도 커져 배터리 저하 직진 정지 리스크 완화.
                                       # 관측 항목: 도착 접근 오버슈트 (정차 오차 5cm 대 유지 여부)
  turn_throttle: 0.5                   # 2026-08-03 실차: 회전(커넥터) 고정 스로틀 — 회전 토크 필요
                                       # 🔴 0.8 → 0.5 **원복** (2026-08-07 저녁, 실측으로 기각).
                                       #   0.8 로 올린 가설은 "저속 스크럽이 실효 반경을 키운다"
                                       #   였는데 **정반대였다.** 4->29 코너에서 설계 호 바깥
                                       #   한계(x=4.61)를 넘은 양을 재 보니:
                                       #     0.5  8/6 9차 +0.21 / 10차 +0.30
                                       #     0.8  8/7 17:25 +0.42 / 17:39 +0.43   ← 정확히 2배
                                       #   궤적 역산 실효 반경 0.47m (설계 0.26, 서보 클램프 0.28).
                                       #   속도를 올리자 언더스티어로 반경이 커져 **인도를 밟았다.**
                                       #   ⚠️ 대가: 9차에서 29->7(23.7°)·7->22(50.0°)가 상한 절단
                                       #     이었고 0.8 이 그걸 없앴다. 되돌리면 재발할 수 있다 —
                                       #     남긴 코스각 종료가 일부 받치지만 보장은 없다.
  near_target_throttle_ratio: 0.75    # 2026-08-06 7차: cruise 0.4 상향 후 접근 감속 재도입
                                       # (0.4×0.75=0.3 → 0.052m/s, 데드존 위). 오버슈트 대책 —
                                       # 1.0 원복 이력은 cruise 0.3 시절 기준이었음
  departure_ramp_distance_m: 0.30      # 2026-08-04 실차: 재출발 후 이 거리까지 turn_throttle —
                                       # 정지 시 틀어진 heading 상태에서 0.8 걸려 인도 침범·이탈한 스윙 방지
  corner_slowdown_distance_m: 0.40     # 2026-08-04: 차→커넥터 진입점 이 거리 안이면 turn_throttle
                                       # = 계획 0.15m + lookahead 0.25m (목표 전환 자연 감속보다 앞) — 계단 관성 대비
  corner_exit_hold_distance_m: 0.20    # 2026-08-04 실차: 커넥터 통과 후 이 거리까지 turn_throttle 유지 —
                                       # lookahead가 목표를 출구 차선으로 먼저 넘겨 회전 중 토크가
                                       # 차선 값(0.3)으로 꺼지던 문제 (동쪽 삼거리 우회전 실측)

  # ── seg heading 대체 (2026-08-07 신설) ────────────────────────────────────
  # 지정 차선의 직선 구간에서 추종 방위를 GPS 대신 비전으로 쓴다:
  #     방위 = 차선 공칭 방위 − seg.heading_error_deg
  # 근거(0806 11회 분석): 차선 4에서 GPS heading 이 x≈3.6 부터 +17° 로 고착·최대 +47° 까지
  #   튀고, _pursue 가 그 오차를 "따라가" 우 풀락 +30° 를 내면서 차가 블록(인도)으로 밀렸다.
  #   11회 중 6회 재현, 침범 시작점은 매번 x 3.95~3.99 (회전 개시점보다 0.38m 앞 = 회전 무관).
  #   같은 순간 seg 는 +6.8° 로 실물과 일치 → seg 방위를 쓰면 좌 5.3° 로 부호가 뒤집힌다.
  # 🔴 seg 의 heading 부호만 쓴다 (0806 실측으로 물리와 일치 확인).
  #    lateral_offset 부호는 미검증이라 seg_correction 이득은 여전히 0 이다 (perception.yaml).
  # 🔴 횡방향 전용 — 회전 개시·도착 판정은 GPS 그대로 (좌표 폴백 개시 재현성 ±1.7cm 보존).
  # 🔴 heading 튐 방어 (2026-08-07 저녁 신설 — control/lane_follower.py _trusted_heading).
  #   GPS 방위가 **위치가 그린 실제 진행 방향**과 이 각도 이상 벌어지면 방위를 믿지 않고
  #   진행 방향으로 대체한다. 직선 구간(FOLLOW)에만 적용 — 회전은 개루프라 방위를 안 쓴다.
  #
  #   근거 (18:04 주행, 4번 차선):
  #     18:04:30  GPS 13.3°  실제 293.6°  차이 +80°
  #     18:04:36  GPS 42.2°  실제 333.9°  차이 +68°
  #   _pursue 가 이 값을 믿고 우측 풀락을 내 y 오차가 +0.11 → -0.29m 로 끌려갔고
  #   그 자세로 회전에 들어가 인도를 밟았다. 0806 인도 침범도 같은 기전이다.
  #
  #   임계 25°: 직선 구간에서 조향 보정 중 코스각이 heading 보다 뒤처지는 양은
  #     창 0.15m·실측 반경 0.47m 기준 약 9° 라 오탐 여유가 충분하다.
  #     0 이하로 두면 완전 비활성 (기존 동작).
  #   ⚠️ 못 잡는 것: ① 정지·저속(베이스라인 미확보 — GPS 원값 사용)
  #                 ② 위치와 방위가 **같이** 틀린 경우 (둘이 일치해 버린다)
  heading_guard:
    disagree_deg: 25.0
    window_m: 0.15               # 코스각 베이스라인. GPS 잡음 1cm → 각도 오차 약 3.8°

  seg_heading:
    lane_nums: []                # 🔴 2026-08-07 **비활성화** (사용자 결정 — 물리적 위험).
                                 #   이유: seg heading 은 버드아이 호모그래피(birdseye.json)에
                                 #   전적으로 의존하는데, 카메라 자세가 캘리브레이션 당시에서
                                 #   틀어지면 **rows 는 정상으로 나오면서 heading 에만 상수 오차**가
                                 #   실린다. 그 값이 조향 지령에 직접 들어가므로 아무도 모르게
                                 #   잘못된 방위로 주행한다 (실패가 조용하다).
                                 #   0807 실측: 카메라 피치가 틀어지자 yellow 10,325→61,900,
                                 #   rows 7→4 로 계산 자체가 죽었다. 롤이 틀어지면 rows 는
                                 #   멀쩡한 채 heading 만 틀어져 더 위험하다.
                                 # 되살리려면: 카메라 자세를 검증할 수단(정지 정렬 실측 등)을
                                 #   먼저 갖추고 [4, 14] 로 되돌린다. 코드는 그대로 남아 있다.
                                 # 허용 차선 번호. **빈 목록 = 기능 꺼짐**(전 차선 GPS)
                                 # 4·14 만 넣은 이유: 양쪽 경계가 모두 노란선이라 seg 가
                                 # 가장 잘 잡히는 차선이다 (7번은 북쪽이 흰색·점선).
                                 # 재처리 실측 가동률(게이트 완화 후): 4번 85% / 14번 68~100%
    disagree_warn_deg: 15.0      # GPS 방위와 이 이상 벌어지면 WARNING (1초 1회) — 증거 수집.
                                 # 0806 침범 시작 시점의 실측 차이가 44° 였다
    steer_rate_deg_per_s: 120.0  # 직선 구간 조향 슬루 상한 — seg↔GPS 전환 시 계단 지령 차단.
                                 # 120°/s = 50Hz 에서 2.4°/tick, 풀락(30°) 도달 0.25s (충분히 빠름).
                                 # 0 = 제한 없음. 회전 구간과 코너 출구에는 걸지 않는다

# §19 도착 판정 — 반경은 control.arrival_radius_m. 속도/유지시간은 OR 조건 (§19-5):
# 속도 임계는 실 ArUco 노이즈 실측(A5) 후 조정 — 못 내려가도 settle 경과로 도착 확정
arrival:
  max_estimated_speed_mps: 0.03
  settle_time_sec: 0.30
  max_heading_error_deg: 60.0    # 🔴 25 → 60 (2026-08-08, 사용자 지시 "방위도 더 잘 인지되도록").
                                 #   0808 로그 실측 — 반경 0.15 안에 들어온 뒤의 방위 오차:
                                 #     면사무소(14번) 782샘플  최소 0.0 / 중앙 38.5 / 최대 41.2
                                 #     우리집  (3번) 120샘플  최소 16.0 / 중앙 19.4 / 최대 27.0
                                 #   25° 로는 면사무소가 **중앙값부터 통과 불가**였다. 15:35~15:36 에
                                 #   위치는 진작 반경 안이었는데 방위 때문에 38초를 서 있었다.
                                 #   8/7 기록엔 정차 직전 방위 190~235°(공칭 180°) = 최대 55° 도 있다.
                                 #   60 = 오늘 41.2 · 어제 55 를 덮고, matching.max_heading_error_deg(60,
                                 #   역방향 확실 배제선)과 같은 값이라 일관된다. 90°(직각) 보다는 낮다.
                                 #   ⚠️ 대가: 차가 60° 까지 비스듬히 선 채로 도착이 인정된다.
                                 #      평행 정차(parallel_stop_distance_m 0.40)가 자세를 잡아 주는 것에
                                 #      의존하게 된다 — 그게 실패하면 눈에 띄게 삐뚤게 선다.
                                 # (구) 2026-08-04: 20→25 — 8/3 데스크 데드락(24.9°>20°) 재발 방지

# §12 차선 매칭 — 초안값, 주행 후 조정
matching:
  distance_weight: 1.0           # m 당 점수
  heading_weight_per_deg: 0.01   # 1° = 1cm 환산 (30° 오차 ≈ 0.3m 페널티)
  max_center_distance_m: 0.20    # 차로 폭 0.25 안쪽
  max_heading_error_deg: 60.0    # 역방향(≈180°) 확실 배제

# §13 목적지 스냅 (관제가 도로 위로 보정해 보낸다는 전제)
destination:
  warn_snap_distance_m: 0.30     # 이보다 멀면 경고 로그 — 거부는 안 함 (§13.3)

# 터널 모드 (2026-08-06) — 동편 측위 유실 구역 한정 추측 항법 (DR).
# 규약 §3.4(이전 pose 주행 금지)의 예외를 구역 + 맹목 거리·시간 상한 안에서만 연다.
# 🔴 수치 전부 잠정 — 실차 테스트하며 조정 (사용자 지시 2026-08-06)
# 🔴 연속 헤딩 추정 (2026-08-08 신설 — localization/heading_estimator.py).
#   HY 프로젝트(hy_vision_handoff)의 state_estimator 방식을 이식했다. 근거 문서: 헤딩보정.md
#
#   무엇이 달라지나: 마커 heading 을 그대로 쓰지 않는다. 자전거 모델로 예측한 값을
#   기준으로 두고, 위치가 그린 코스각을 course_alpha 만큼 섞는다. 마커 heading 은
#   초기화와 marker_alpha(3%) 약보정에만 쓴다.
#
#   왜: 기존 heading_guard 는 **이진 전환**이라 임계 근처에서 토글한다. 0808 15:10
#   주행 19->20 에서 30초에 19회 전환했고, 두 값 차이가 최대 169° 라 전환마다 추종
#   목표가 뒤집혀 진폭 0.37m 왕복이 났다. 이 추정기는 전환하지 않아 그 진동이 없다.
#
# 🔴 **위치 주의 (2026-08-08 사고)**: 이 블록은 반드시 **최상위**여야 한다 —
#   runtime.py 가 `self.config.control.get("heading_estimator")` 로 읽는데 그 dict 는
#   control.yaml **파일 전체**다 (tunnel·arrival·matching 과 같은 층).
#   처음에 `control:` 안에 넣었더니 조용히 None 이 되어 17:24 주행이 통째로
#   **추정기 없이** 돌았다. 기동 로그에 「연속 헤딩 추정 활성」 줄이 있는지로 확인할 것.
#
#   ⚠️ 자전거 모델 수치(wheel_bias_deg·servo_rate_dps·accel_mps2·speed_points)는
#      아래 tunnel 섹션을 **공유**한다. tunnel 이 없으면 켜지지 않는다.
#   ⚠️ 되돌리기: enabled: false 한 줄. 코드는 그대로 두고 마커 heading 통과로 돌아간다.
#   ⚠️ 이 값이 켜지면 heading_guard·course_heading_lanes 는 이미 좋아진 heading 위에서
#      돌게 된다. 사실상 발동하지 않겠지만 이번 주행에서는 **그대로 둔다** —
#      한 번에 하나만 바꾸기 위해서다. 로그로 발동 횟수를 보고 다음에 정리한다.
heading_estimator:
  enabled: true
  course_min_distance_m: 0.04   # 이만큼 움직여야 코스각을 계산한다 (HY 실측값)
  course_alpha: 0.45            # 코스각 혼합 비율 — 1.0 이면 코스각 그대로
  marker_alpha: 0.03            # 마커 heading 반영 3%. 정지 중 자세 노이즈를 안 따라가게

tunnel:
  enabled: true
  # 구역 확대 (2026-08-06 오전 사용자 관찰): 맵 모서리로 갈수록 실위치보다 좌표가
  # 위아래 가변으로 밀린다 → 중앙 사거리 도로만 신뢰 구역으로 남기고 외곽 벨트 전체에
  # 보험을 건다. GPS 측 재보정 예정 — 고쳐지면 동편만 남기고 줄인다 (전부 잠정).
  zones:                              # [x_min, x_max, y_min, y_max]
    - [3.78, 5.10, -0.10, 3.10]       # 동편: x=3.84 왜곡 전조 / 3.97·3.99·4.21·4.85 유실 실측
    - [-0.10, 0.70, -0.10, 3.10]      # 서편 벨트 (17~20번 — 좌하단 매칭실패 979건 실측 포함)
    - [-0.10, 5.10, -0.10, 0.60]      # 남측 벨트 (13~16번 — 모서리 밀림 관찰)
    - [-0.10, 5.10, 2.40, 3.10]       # 북측 벨트 (1~4번 — 모서리 밀림 관찰)
  max_blind_distance_m: 1.2           # 앵커 이후 맹목 주행 거리 상한
  max_blind_time_s: 30.0              # 시간 상한 (cruise 0.052m/s 기준 1.2m ≈ 23s)
  distrust_deviation_m: 0.30          # 구역 내 수신 pose가 DR 예측과 이보다 어긋나면 의심 거부
                                      # (8/5 "y 떠오름" 왜곡: 0.11m 드리프트 후 유실 — 방어 대상)
  wheel_bias_deg: -1.6                # 8/4 트림 118 GPS 실측 잔차 (turn_param_sim과 동일 모델)
  servo_rate_dps: 120.0               # 서보 조향 속도 (바퀴각 기준)
  accel_mps2: 0.5                     # 가감속 슬루
  speed_points:                       # 스로틀→속도 실측 보간점 (2026-08-04). 첫 점 이하 = 데드존 0
    - [0.24, 0.0]
    - [0.30, 0.052]
    - [1.00, 0.199]
