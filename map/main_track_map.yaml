# main_track_map.yaml — 시연지도 차선 그래프 (단일 소스)
#
# 🔴 이 파일은 차량(rc_car)과 관제 서버가 공유하는 유일한 맵 데이터다. 사본 금지.
# 생성: rc_car/tools/build_demo_map.py (직접 수정하지 말고 생성기를 고쳐 재생성)
# 근거: 자료/자율주행무인택시_시연지도최종안.png 픽셀 판독 (±2cm 추정 오차, 실측 대기)
#
# 두 순환계와 다리 (2026-07-28 결정):
#   화살표+가까운 차선 진입 규칙만으로는 inner 16 / outer 16 차선이 완전 분리된다.
#   두 순환계를 잇는 다리는 두 종류다:
#   ① (2026-08-04 폐지) 점선 구간 차선 변경 — 짧은 이음매에서 대각 기동이
#      인도 침입을 유발해 제거. 이음매는 병합 차선에 흡수(정차 가능)
#   ② 회전 진입 차선 선택(_far) 16개 — 2차로 도로로 회전 시 먼 차선으로도 진입
#   → 전체 32차선 강연결: 목적지는 destination_allowed 차선이면 어디든 가능.
#   → 다리를 전부 지우면 다시 분리된다 — 로더·테스트가 강연결을 검증한다.
#
# 확장(명세서 §11.2에 없는 것): lanes.*.circuit(링 계열 참고용), connectors.*.radius_m

map:
